name: Update Metal Calendar

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write      # nécessaire pour créer une issue en cas d'échec

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper

      - name: Generate ICS
        run: python generate_ics.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add concerts-metal.ics
          git commit -m "Update calendar $(date -u +'%Y-%m-%d')" || exit 0
          git push

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Échec de la mise à jour du calendrier (${new Date().toISOString().slice(0,10)})`,
              body: [
                `Le workflow a échoué le ${new Date().toISOString()}.`,
                ``,
                `Voir les logs : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Causes probables : site indisponible, blocage 403 depuis les IP GitHub, ou changement de structure HTML.`
              ].join('\n')
            })